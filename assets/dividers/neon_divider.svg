<svg width="100%" height="30" viewBox="0 0 1200 30" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="divGrad" gradientUnits="userSpaceOnUse" x1="0" y1="15" x2="1200" y2="15">
      <stop offset="0%" stop-color="#00b8d9" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ff2079" stop-opacity="1"/>
      <stop offset="82%" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

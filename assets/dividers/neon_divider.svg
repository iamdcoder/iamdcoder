    </filter>
  </defs>
  <line x1="0" y1="15" x2="1200" y2="15" stroke="url(#divGrad)" stroke-width="1.6" filter="url(#glow)"/>
  <rect x="588" y="9" width="24" height="12" fill="#0b0e1a" stroke="#00e5ff" stroke-width="1.4" filter="url(#glow)" transform="rotate(45 600 15)"/>

<svg width="100%" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#ff2079"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan2" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="898" height="218" rx="10" fill="#0b0e1a"/>
  <rect x="1" y="1" width="898" height="218" rx="10" fill="url(#grid2)"/>
  <rect x="1" y="1" width="898" height="218" rx="10" fill="url(#scan2)"/>
  <rect x="1.5" y="1.5" width="897" height="217" rx="10" fill="none" stroke="url(#footGrad)" stroke-width="1.3" opacity="0.7"/>

  <g stroke="#00e5ff" stroke-width="2" opacity="0.9" fill="none">
    <polyline points="14,34 14,14 34,14"/>
    <polyline points="866,14 886,14 886,34"/>
    <polyline points="14,186 14,206 34,206"/>
    <polyline points="866,206 886,206 886,186"/>
  </g>

  <text x="450" y="50" font-size="13" letter-spacing="2" fill="#8b93a7" text-anchor="middle">devansh@github:~$ exit</text>

  <text x="448" y="119" font-size="32" font-weight="bold" fill="#ff2079" opacity="0.5" text-anchor="middle" letter-spacing="2">THANKS FOR VISITING</text>
  <text x="452" y="117" font-size="32" font-weight="bold" fill="#00e5ff" opacity="0.5" text-anchor="middle" letter-spacing="2">THANKS FOR VISITING</text>
  <text x="450" y="118" font-size="32" font-weight="bold" fill="url(#footGrad)" text-anchor="middle" letter-spacing="2" filter="url(#glow3)">THANKS FOR VISITING</text>

  <text x="440" y="152" font-size="15" fill="#39ff88" text-anchor="middle" letter-spacing="1">still building...</text>
  <rect x="522" y="140" width="10" height="16" fill="#39ff88">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="193" font-size="11" fill="#8b93a7" text-anchor="middle" letter-spacing="1.5">connection closed — see you in the next commit</text>
</svg>

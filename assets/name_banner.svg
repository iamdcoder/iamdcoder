    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="14" fill="#0b0e1a"/>

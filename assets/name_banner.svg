<svg width="100%" viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="nameGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="nameGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39ff88"/>
      <stop offset="100%" stop-color="#ff2079"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00e5ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="898" height="188" rx="10" fill="#0b0e1a"/>
  <rect x="1" y="1" width="898" height="188" rx="10" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="188" rx="10" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="897" height="187" rx="10" fill="none" stroke="url(#nameGrad1)" stroke-width="1.5" opacity="0.8"/>

  <text x="40" y="42" font-size="13" letter-spacing="3" fill="#39ff88" opacity="0.9">&gt; identity_verified ✓</text>

  <text x="38" y="99" font-size="52" font-weight="bold" fill="#ff2079" opacity="0.5">DEVANSH</text>
  <text x="42" y="97" font-size="52" font-weight="bold" fill="#00e5ff" opacity="0.5">DEVANSH</text>
  <text x="40" y="98" font-size="52" font-weight="bold" fill="url(#nameGrad1)" filter="url(#glow2)">DEVANSH</text>

  <text x="38" y="149" font-size="38" font-weight="bold" fill="#00e5ff" opacity="0.45">ARVIND TRIPATHI</text>
  <text x="42" y="147" font-size="38" font-weight="bold" fill="#ff2079" opacity="0.45">ARVIND TRIPATHI</text>
  <text x="40" y="148" font-size="38" font-weight="bold" fill="url(#nameGrad2)" filter="url(#glow2)">ARVIND TRIPATHI</text>

  <rect x="402" y="123" width="12" height="28" fill="#39ff88">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="173" font-size="12" letter-spacing="2" fill="#8b93a7">student · developer · problem solver · learner</text>
